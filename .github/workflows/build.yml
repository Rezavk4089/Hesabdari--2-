
name: Build Hesabdari APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "Checking Android project files..."

          if [ ! -f extracted/settings.gradle ] && [ ! -f extracted/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 3 -type f | head -n 80
            exit 1
          fi

          if [ ! -f extracted/app/build.gradle ] && [ ! -f extracted/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle not found"
            find extracted -maxdepth 3 -type f | head -n 80
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        run: |
          cd extracted
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
